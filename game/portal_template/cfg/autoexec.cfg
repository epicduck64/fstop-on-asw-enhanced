// The leaked source ships hud_show_control_helper = 0, this brings back the HUD, which has a small state issue with photo state
hud_show_control_helper 1

// Console can sometimes be disabled, this makes sure it's always available
con_enable 1

// Route the mouse wheel to the held weapon instead of weapon switching, allows resizing placement
bind "MWHEELUP" "mwheel_up"
bind "MWHEELDOWN" "mwheel_down"
