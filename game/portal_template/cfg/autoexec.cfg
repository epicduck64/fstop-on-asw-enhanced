// F-STOP ("Aperture") defaults
//
// The leaked source ships hud_show_control_helper = 0 and gates the photo inventory behind
// cl_force_draw_photo_inventory (also 0), so with a stock config none of the Aperture HUD
// (capture-vs-place mode icons, photo inventory) is visible. Turn the mode helper on so the
// camera's capture / neutral / picture states show up.

hud_show_control_helper 1

// Route the mouse wheel to the held weapon instead of weapon switching, so the camera zooms its
// FOV and the placement tool resizes the carried object (mirrors the leak's mwheel_up/mwheel_down).
bind "MWHEELUP" "mwheel_up"
bind "MWHEELDOWN" "mwheel_down"

// The photo inventory strip is FCVAR_CHEAT, so it needs sv_cheats; it also only shows while
// its flash timer is running (briefly after a capture). Uncomment if you want it up.
//sv_cheats 1
//cl_force_draw_photo_inventory 1

// npc_height_adjust is Valve's IK height-adjust TEST MODE. It feeds a recursive filter into the
// rendered origin, which on the F-STOP zombie (whose root bone translates) climbs a little every
// IK ground-contact window - the zombie starts clipping into the floor, resets when an attack
// closes the window, then floats. The source default is now 0; this also overrides any archived
// value saved by an older config.
npc_height_adjust 0
